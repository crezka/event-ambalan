<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Kehadiran - BUBARAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Wadah kamera */
        #reader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Memastikan video kamera proporsional dan tidak melar/distorsi */
        #reader video { 
            object-fit: cover !important; 
            width: 100% !important; 
            height: 100% !important; 
        }

        /* Menyembunyikan elemen bawaan library agar tidak double frame */
        #reader svg { display: none !important; }
        #qr-shaded-region { display: none !important; }
    </style>
</head>
<body class="text-white">

    <!-- Area Kamera -->
    <div id="reader"></div>

    <!-- UI Overlay Bingkai Scanner Custom -->
    <div class="fixed inset-0 z-10 pointer-events-none flex flex-col items-center justify-center">
        <!-- Bingkai Putih -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72">
            <div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-white rounded-tl-lg"></div>
            <div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-white rounded-tr-lg"></div>
            <div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-white rounded-bl-lg"></div>
            <div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-white rounded-br-lg"></div>
            
            <!-- Garis Scan -->
            <div class="absolute top-0 left-0 w-full h-1 bg-red-500/80 shadow-[0_0_15px_red] animate-[scan_2s_ease-in-out_infinite]"></div>
        </div>
        <p class="mt-8 text-sm text-white font-medium tracking-wide drop-shadow-md bg-black/50 px-4 py-2 rounded-full">Arahkan QR Code ke arah layar</p>
    </div>

    <!-- Pop-up Notifikasi -->
    <div id="statusMessage" class="fixed top-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm p-4 rounded-xl text-center hidden z-30 font-bold text-sm shadow-2xl transition-all"></div>

    <!-- Kartu Hasil Scan -->
    <div id="resultCard" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm bg-[#05291c]/95 backdrop-blur-md border border-[#d4af37]/50 rounded-xl p-5 hidden z-30 shadow-2xl">
        <h3 class="text-[#d4af37] font-bold border-b border-[#d4af37]/30 pb-2 mb-3">✅ Berhasil Discan</h3>
        <div class="space-y-1">
            <p class="text-xs text-gray-300">Nama: <span id="resName" class="text-white font-bold text-sm ml-1"></span></p>
            <p class="text-xs text-gray-300">Tiket: <span id="resTicket" class="text-white font-bold text-sm ml-1"></span></p>
            <p class="text-xs text-gray-300">Angkatan: <span id="resAngkatan" class="text-white font-bold text-sm ml-1"></span></p>
        </div>
    </div>

    <!-- Tombol Mulai -->
    <div id="startOverlay" class="fixed inset-0 bg-emerald-950 z-50 flex flex-col items-center justify-center px-4 text-center">
        <div class="w-16 h-16 rounded-full bg-gold-500/20 border-2 border-[#d4af37] flex items-center justify-center text-[#d4af37] text-2xl mb-6">
            <i class="fa-solid fa-qrcode"></i>
        </div>
        <h2 class="font-bold text-xl text-[#d4af37] mb-2">Scanner BUBARAN</h2>
        <p class="text-gray-400 text-sm mb-8">Izinkan akses kamera untuk memulai proses scan tiket.</p>
        <button id="startCamBtn" class="bg-[#d4af37] text-[#031710] font-bold py-3 px-10 rounded-full shadow-xl hover:scale-105 transition-transform uppercase tracking-wider text-sm">
            Buka Kamera
        </button>
    </div>

    <style>
        @keyframes scan {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(256px); } 
        }
    </style>

    <script>
        // URL GOOGLE APPS SCRIPT ANDA
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOQYJi1UsMdKSxBHfh729p2Ios8T_p_IgNObINUB2a6TAyD88N8EC71CLlb__Z7j5dlg/exec";

        const statusMessage = document.getElementById('statusMessage');
        const resultCard = document.getElementById('resultCard');
        const startOverlay = document.getElementById('startOverlay');
        let html5QrCode;
        let isProcessing = false;

        function parseQRText(text) {
            const data = {};
            const lines = text.split('\n');
            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim().toLowerCase();
                    const value = parts.slice(1).join(':').trim();
                    
                    if (key.includes('ticket')) data.ticket = value;
                    else if (key.includes('name')) data.name = value;
                    else if (key.includes('angkatan')) data.angkatan = value;
                    else if (key.includes('status')) data.status = value;
                    else if (key.includes('guest')) data.guest = value;
                }
            });
            return data;
        }

        function showStatus(message, type) {
            statusMessage.classList.remove('hidden', 'bg-yellow-500', 'bg-green-600', 'bg-red-600', 'text-[#031710]', 'text-white');
            if (type === 'loading') {
                statusMessage.classList.add('bg-yellow-500', 'text-[#031710]');
            } else if (type === 'success') {
                statusMessage.classList.add('bg-green-600', 'text-white');
            } else {
                statusMessage.classList.add('bg-red-600', 'text-white');
            }
            statusMessage.innerHTML = message;
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            
            html5QrCode.pause();
            
            showStatus("⏳ Menyimpan...", "loading");
            resultCard.classList.add('hidden');

            const scannedData = parseQRText(decodedText);

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(scannedData)
            })
            .then(response => response.json())
            .then(data => {
                // Getar 200ms saat sukses
                if (navigator.vibrate) navigator.vibrate(200); 

                showStatus("✅ Tersimpan!", "success");
                
                resultCard.classList.remove('hidden');
                document.getElementById('resName').innerText = scannedData.name || "-";
                document.getElementById('resTicket').innerText = scannedData.ticket || "-";
                document.getElementById('resAngkatan').innerText = scannedData.angkatan || "-";

                // Jeda 0.2 detik (200ms) sebelum lanjut scan lagi
                setTimeout(() => {
                    statusMessage.classList.add('hidden');
                    isProcessing = false;
                    html5QrCode.resume();
                }, 200);
            })
            .catch(error => {
                console.error("Error:", error);
                showStatus("❌ Gagal! Cek koneksi.", "error");

                setTimeout(() => {
                    statusMessage.classList.add('hidden');
                    isProcessing = false;
                    html5QrCode.resume();
                }, 2000);
            });
        }

        document.getElementById('startCamBtn').addEventListener('click', () => {
            startOverlay.style.display = 'none';
            
            html5QrCode = new Html5Qrcode("reader");
            
            // OPTIMASI TINGKAT TINGGI UNTUK KECEPATAN:
            const config = { 
                fps: 30, 
                disableFlip: true, // Menghemat 50% CPU karena tidak mencari QR Code versi cermin
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ], // Hanya mencari tipe QR
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true // Menggunakan hardware akselerasi bawaan HP
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                console.log("Kamera belakang tidak ditemukan, beralih ke webcam...");
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
                .catch(err2 => {
                    alert("Gagal membuka kamera. Pastikan izin kamera aktif di browser Anda.");
                    startOverlay.style.display = 'flex';
                });
            });
        });
    </script>
</body>
</html>
